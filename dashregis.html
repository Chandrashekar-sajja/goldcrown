<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashBoardRegister</title>
    <link rel="stylesheet" href="dash.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
    <div class="top-bar">
        <div class="inner-container">
            <div class="contact-info">
          <div class="location">
            <i class="fa-solid fa-message"></i>
            <span>support@GoldCrown.com</span>
          </div>
          <div class="phone">
            <i class="fa-solid fa-phone"></i>
            <span>987654321</span>
          </div>
        </div>
        <div class="user-nav">
          <ul>
            <li><i class="fa-solid fa-user"></i> Sign In</li>
            <li>|</li>
            <li>Join Us</li>
          </ul>
        </div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="inner-container">
            <div class="logo">
          <img src="dashboard-logo.png" alt="GoldCrown Company Logo">
        </div>

        <ul class="main-menu">
          <li class="active"><a href="#">HOME</a></li>
          <li><a href="#">HOW IT WORK</a></li>
          <li><a href="#">ABOUT US</a></li>
          <li><a href="#">OUR TEAM</a></li>
          <li><a href="#">CONTACT US</a></li>
        </ul>
        </div>
    </nav>
    </header>
    
   

<main>
  <div class="login-section">
    <div class="inner-container">
    <div class="login">
      <h2>Register</h2>
      <hr>
      <form>
        <label for="SponsorId">Sponsor Id:</label>
        <input type="text" id="sponsorId" name="sponsorId" required>

        <label for="YourName">Your Name:</label>
        <input type="text" id="your Name" name="your Name" required>

        <label for="EmailAddress">Email Address:</label>
        <input type="text" id="Email Address" name="Email Address" required>

        <label for="MobileNumber">Mobile Number:</label>
        <input type="text" id="Mobile Number" name="Mobile Number" required>

        <label for="EnterPassword">Enter Password:</label>
        <input type="password" id="Enter Password" name="Enter Password" required>

        <label for="ReEnterPassword">Re Enter Password:</label>
        <input type="password" id="Re Enter Password" name="Re Enter Password" required>

        <label for="country">Country Code :</label>
        <input type="text" id="country" name="country" class = "small-input" placeholder="Country Code" required>

        <label for="captcha">Captcha Code :</label>
        <input type="text" id="captcha" name="captcha" class = "small-input" placeholder="Captcha Code" required>

        

        <button type="submit" class="btn-submit">Login</button>

       
      </form>
    </div>
    </div>
  </div>
</main>




    <footer>
    <div class="footer">
      <div class="inner-container">
        <div class="col-50">
          <ul class="footer-nav">
            <li><a href="#">Home</a></li>
            <li><a href="#">How it work</a></li>
            <li><a href="#">About us</a></li>
            <li><a href="#">Our team</a></li>
            <li><a href="#">Contact us</a></li>
          </ul>
        </div>
        <div class="col-50 text-right">
          <img src="footer-logo.png" alt="GoldCrown Footer Logo">
        </div>
      </div>
    </div>


    <div class="footer-bottom">
      <div class="inner-container">
        <p>Copyright @ 2019. All Rights Reserved By GoldCrown</p>
      </div>
    </div>
  </footer>
</body>
</html>
